services:
  # 1. Spring Boot Backend Web Service (Java 17 + PostgreSQL)
  - type: web
    name: bizpartner-backend
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: bizpartner-db
          property: connectionString
      - key: JWT_SECRET
        value: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - key: JWT_EXPIRATION_MS
        value: 86400000

  # 2. React Frontend Static Site
  - type: web
    name: bizpartner-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # 3. Managed PostgreSQL Database (Free Tier)
  - name: bizpartner-db
    databaseName: business_assistant_db
    user: business_admin
    plan: free
