# ==========================================================
# BizPartner AI - Master Spring Boot Configuration
# ==========================================================

spring.application.name=bizpartner-ai-backend
server.port=${PORT:8080}

# Default profile is 'dev' (In-Memory H2 DB for zero-config offline running).
# Switch to 'prod' to use MySQL 8.0+!
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Jackson JSON Formatter
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata

# Application & Integration Properties
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.gemini.api-key=${GEMINI_API_KEY:}
app.ml-service.url=${ML_SERVICE_URL:http://localhost:8000}
