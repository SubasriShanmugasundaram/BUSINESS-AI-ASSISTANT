# ==========================================================
# Dev Profile (H2 In-Memory with MySQL Compatibility Mode)
# Allows developers and reviewers to run the backend instantly
# without needing a local MySQL server installed and running.
# ==========================================================
spring.datasource.url=jdbc:h2:mem:business_assistant_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
